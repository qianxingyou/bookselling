<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手交易平台</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <span>📚</span>
                <span>好物流转</span>
            </div>
            <div class="nav-links">
                <a href="#home">首页</a>
                <a href="#books">物品列表</a>
                <a href="#contact">联系卖家</a>
            </div>
        </nav>
    </header>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>毕业季，让好物继续传递</h1>
            <p>大四毕业生闲置物品出售</p>
            <button onclick="scrollToBooks()">开始浏览</button>
        </div>
    </section>

    <section id="books" class="books-section">
        <div class="section-header">
            <h2>我们的闲置</h2>
            <p>精心整理的二手好物，等待新主人</p>
        </div>

        <div class="category-filter" id="categoryFilter">
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="搜索好物...">
            <select id="priceSort">
                <option value="">价格排序</option>
                <option value="asc">价格从低到高</option>
                <option value="desc">价格从高到低</option>
            </select>
        </div>

        <div id="booksGrid" class="books-grid">
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            <p>没有找到符合条件的物品</p>
        </div>
    </section>

    <section id="contact" class="contact-section">
        <div class="contact-content">
            <h2>联系我们</h2>
            <p>如果对某物感兴趣，欢迎联系我们！</p>
            <div class="contact-methods">
                <div class="contact-item">
                    <span class="contact-icon">📱</span>
                    <div>
                        <span class="contact-label">手机号</span>
                        <span class="contact-value">13033556230</span>
                    </div>
                </div>
                <div class="contact-item">
                    <span class="contact-icon">📍</span>
                    <div>
                        <span class="contact-label">地点</span>
                        <span class="contact-value">竹五335宿舍</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026  让好物继续传递</p>
    </footer>

    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
